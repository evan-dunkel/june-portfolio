media:
  - name: works_images
    label: Artwork Images
    input: src/assets/works
    output: /src/assets/works
    extensions:
      - svg
      - jpg
      - jpeg
      - png
      - webp
      - gif
    categories: [image]

  - name: works_videos
    label: Videos
    input: public/videos
    output: /videos
    extensions:
      - mp4
      - webm
    categories: [video]

actions:
  - name: deploy
    label: Deploy to Cloudflare
    workflow: deploy.yml
    confirm:
      title: Deploy site?
      message: This will trigger a deployment on Cloudflare Pages.
      button: Deploy

content:
  - name: settings
    label: Settings
    type: file
    path: src/content/settings/settings.yml
    format: yaml
    fields:
      - name: name
        label: Name
        type: string
        description: Your full name as it appears at the top of the site.

      - name: email
        label: Email
        type: string
        description: Your contact email. Visitors can tap it to copy to their clipboard.

      - name: tagline
        label: Tagline
        type: string
        description: Short phrase under your name, like "Illustration" or "Visual Artist".
        required: false

      - name: about
        label: About
        type: text
        description: Optional 1-2 sentence blurb about your work. Leave empty to hide this section.
        required: false

  - name: portfolio
    label: Portfolio
    type: file
    path: src/content/portfolio/works.yml
    format: yaml
    fields:
      - name: sections
        label: Sections
        type: object
        list:
          collapsible:
            collapsed: false
            summary: "{title}"
        description:
        fields:
          - name: title
            label: Section Title
            type: string
            description:

          - name: works
            label: Works
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{alt}"
            description:
            fields:
              - name: src
                label: File
                type: image
                description:

              - name: alt
                label: Alt Text
                type: string
                description: Description for screen readers and search engines (Short and descriptive is best)

              - name: caption
                label: Caption
                type: text
                description: Optional description shown in the photo viewer
                required: false

              # - name: poster
              #   label: Poster Image
              #   type: image
              #   description: Thumbnail image shown in the grid for video works. Required for videos, ignored for images.
              #   required: false
